services:
  waha:
    image: devlikeapro/waha:latest
    env_file: .env
    volumes:
      - waha-sessions:/app/.sessions
    ports:
      - "127.0.0.1:${WAHA_PORT:-3000}:3000"
    restart: unless-stopped

  app:
    image: "${APP_IMAGE}"
    env_file: .env
    environment:
      WAHA_URL: http://waha:3000
      PORT: 3102
    ports:
      - "127.0.0.1:${APP_PORT:-4000}:3102"
    depends_on:
      - waha
    restart: unless-stopped

volumes:
  waha-sessions:
